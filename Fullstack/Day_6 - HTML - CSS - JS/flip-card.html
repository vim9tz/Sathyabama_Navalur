<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .flip-card {
            width: 300px;
            height: 340px;
            /* Important 3d Depth */
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            /* Important Smooth Rotatioj */
            transition:
                transform 0.6s ease;
            /* Important */
            transform-style: preserve-3d;
        }

        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Important */
            backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: -7px 4px 50px 6px rgba(0, 0, 0, 0.62);
        }

        .flip-card-front {
            background: #2A7B9B;
            background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(237, 221, 83, 1) 100%);
            color: white;
        }

        .flip-card-back {
            background: #833AB4;
            background: linear-gradient(90deg, rgba(131, 58, 180, 1) 0%, rgba(253, 29, 29, 1) 50%, rgba(252, 176, 69, 1) 100%);
            color: white;
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <h2>Front Side</h2>
                <p>Hover to flip</p>
            </div>
            <div class="flip-card-back">
                <h2>Back Side</h2>
                <p>Hello Students!</p>
            </div>
        </div>
    </div>
</body>

</html>
