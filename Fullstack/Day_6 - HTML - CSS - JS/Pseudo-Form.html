<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Class Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f2f2f2;
        }

        .form-container {
            width: 400px;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid gray;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
        }
        /* =========================
           1. :HOVER
        ========================= */
        input:hover {
            border-color: orange;
        }

        /* =========================
           2. :FOCUS
        ========================= */
        input:focus {
            border-color: blue;
            background-color: #eef5ff;
        }

        /* =========================
           3. :VALID
        ========================= */
        input:valid {
            border-color: green;
        }

        /* =========================
           4. :INVALID
        ========================= */
        input:invalid {
            border-color: red;
        }

        /* =========================
           CHECKBOX
        ========================= */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .checkbox-group input {
            width: auto;
        }

        /* =========================
           5. :CHECKED
        ========================= */
        .checkbox-group input:checked {
            accent-color: green;
        }

        .checkbox-group input:checked+label {
            color: green;
        }

        .checkbox-group label {
            margin: 0;
        }

        /* =========================
           BUTTON
        ========================= */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: blue;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* =========================
           :HOVER ON BUTTON
        ========================= */
        button:hover {
            background-color: green;
            transform: translateY(-2px);
        }

        /* =========================
           6. :ACTIVE
        ========================= */
        button:active {
            background-color: darkgreen;
            transform: scale(0.96);
        }
    </style>
</head>


<body>

    <div class="form-container">

        <h2>Registration Form</h2>


        <form>

            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input type="text" id="name" name="name" placeholder="Enter your name" minlength="3" required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email" id="email" name="email" placeholder="Enter your email" required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password" id="password" name="password" placeholder="Minimum 6 characters" minlength="6"
                    required>

            </div>


            <!-- AGE -->

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input type="number" id="age" name="age" min="18" max="60" required>

            </div>


            <!-- CHECKBOX -->

            <div class="checkbox-group">

                <input type="checkbox" id="terms" required>

                <label for="terms">
                    I agree to the Terms & Conditions
                </label>

            </div>


            <!-- BUTTON -->

            <button type="submit">
                Register
            </button>

        </form>

    </div>

</body>

</html>
