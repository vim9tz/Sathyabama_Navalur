<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Relative and Absolute</title>

    <style>
        .parent {
            width: 400px;
            height: 300px;
            background-color: lightblue;
            border: 3px solid blue;
            /* Important */
            position: relative;
        }

        .child {
            width: 100px;
            height: 100px;
            background-color: red;
            color: white;
            /* Important */
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>

<body>
    <h1>
        Relative and Absolute
    </h1>
    <div class="parent">
        Parent
        <div class="child">
            Child
        </div>
    </div>
</body>

</html>
